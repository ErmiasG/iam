apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oauth.fullname" . }}
  labels:
    {{- include "oauth.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oauth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "oauth.labels" . | nindent 8 }}
	{{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      serviceAccountName: {{ include "oauth.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: configure
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "oauth.image_repository" . }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: 
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if [ -f /opt/keycloak/data/.iam-configured ]; then
                exit 0
              fi
              nohup /opt/keycloak/bin/kc.sh start-dev &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
              for attempt in {1..120}; do
                kill -0 "$server_pid"
                if curl --fail --silent http://localhost:8080/realms/master/.well-known/openid-configuration >/dev/null; then
                  break
                fi
                sleep 2
              done
              curl --fail --silent http://localhost:8080/realms/master/.well-known/openid-configuration >/dev/null
              /bin/bash /scripts/configure-keycloak.sh
              touch /opt/keycloak/data/.iam-configured
          env:
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: {{ .Values.kcadmin.username }}
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ template "oauth.fullname" . }}
                key: kcadmin-password
          - name: CLIENTS_JSON_PATH
            value: /resources/clients.json          
          - name: USERS_JSON_PATH
            value: /resources/users.json
          - name: GROUPS_JSON_PATH
            value: /resources/groups.json
          - name: ROLES_JSON_PATH
            value: /resources/roles.json
          - name: SCOPES_JSON_PATH
            value: /resources/scopes.json
          - name: CLIENT_ID
            value: {{ .Values.defaultClientId | quote }}
          - name: REALM
            value: {{ .Values.realm | quote }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "oauth.image_repository" . }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - start-dev
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /realms/{{ .Values.realm }}/.well-known/openid-configuration
              port: http
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: {{ .Values.kcadmin.username }}
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ template "oauth.fullname" . }}
                key: kcadmin-password
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
