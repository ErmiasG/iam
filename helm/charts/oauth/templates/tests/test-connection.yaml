apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "oauth.fullname" . }}-test-connection"
  labels:
    {{- include "oauth.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-O', '/dev/null', 'http://{{ .Values.service.name }}:{{ .Values.service.port }}/realms/{{ .Values.realm }}/.well-known/openid-configuration']
  restartPolicy: Never
